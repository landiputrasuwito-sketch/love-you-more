
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love You More ♡</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: radial-gradient(circle, #260b27, #08040c 70%);
  color: white;
  font-family: 'Courier New', monospace;
  min-height: 100vh;
  overflow: hidden;
}

[hidden] {
  display: none !important;
}

/* MATRIX BACKGROUND */
#matrix {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

/* MAIN CONTAINER */
.container {
  position: relative;
  z-index: 2;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
}

/* COUNTDOWN */
#count {
  font-size: clamp(90px, 22vw, 160px);
  font-weight: bold;
  color: #ff8be9;
  text-shadow:
    0 0 15px #ff00c8,
    0 0 35px #ff00c8,
    0 0 60px #ff00c8;
}

/* MAIN TITLE */
h1 {
  font-size: clamp(30px, 8vw, 65px);
  letter-spacing: 5px;
  color: white;
  text-shadow:
    0 0 15px #ff00c8,
    0 0 35px #ff00c8;
  opacity: 0;
  transform: scale(.5);
  transition: 1s;
}

h1.show {
  opacity: 1;
  transform: scale(1);
}

/* HEART */
#heart {
  width: min(440px, 90vw);
  height: min(350px, 70vw);
  overflow: visible;
}

/* MESSAGE */
#message {
  max-width: 650px;
  font-family: Arial, sans-serif;
  font-size: clamp(15px, 3vw, 19px);
  line-height: 1.8;
  color: #ffe2f7;
  text-shadow: 0 0 12px #ff4bd2;
  opacity: 0;
  transform: translateY(20px);
  transition: 1.5s;
}

#message.show {
  opacity: 1;
  transform: translateY(0);
}

/* BUTTON */
button {
  margin-top: 22px;
  padding: 13px 28px;
  border: 1px solid #ff7cde;
  border-radius: 30px;
  color: white;
  background: #a51b7a55;
  cursor: pointer;
  font-size: 14px;
  box-shadow: 0 0 15px #ff00c8;
  transition: .3s;
}

button:hover {
  background: #d52a9c;
  transform: scale(1.05);
}

/* FOOTER */
.footer {
  position: fixed;
  bottom: 12px;
  width: 100%;
  text-align: center;
  color: #e8a2d8;
  font-size: 10px;
  letter-spacing: 3px;
  z-index: 3;
}

/* OPENING */
.opening {
  position: fixed;
  inset: 0;
  z-index: 10;
  background: radial-gradient(circle, #310d32, #08040c 75%);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 25px;
  transition: opacity 1s, visibility 1s;
}

.opening.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.opening h2 {
  font-size: clamp(30px, 8vw, 55px);
  color: #ff9de9;
  text-shadow:
    0 0 15px #ff00c8,
    0 0 35px #ff00c8;
  margin-bottom: 25px;
  animation: pop 1.2s ease;
}

.opening p {
  font-family: Arial, sans-serif;
  font-size: 18px;
  line-height: 1.8;
  color: #ffe5f8;
  margin-bottom: 30px;
}

.opening button {
  padding: 14px 30px;
  border: 1px solid #ff7cde;
  border-radius: 30px;
  color: white;
  background: #a51b7a55;
  box-shadow: 0 0 20px #ff00c8;
  cursor: pointer;
  letter-spacing: 1px;
}

@keyframes pop {
  0% {
    transform: scale(.2);
    opacity: 0;
  }
  70% {
    transform: scale(1.2);
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}

@media(max-height:600px) {
  .container {
    padding: 5px;
  }

  #heart {
    height: 190px;
    width: 260px;
  }
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<!-- OPENING SCREEN -->
<div class="opening" id="opening">

  <h2>HELLO MY WORLD ♡</h2>

  <p>
    Tolong di baca ya,<br>
    ada pesan dari aku hehehe ✨
  </p>

  <button onclick="openMessage()">
    Buka pesan ♡
  </button>

</div>

<!-- MAIN CONTENT -->
<div class="container">

  <div id="count" hidden>3</div>

  <h1 id="title">LOVE YOU MORE ♡</h1>

  <canvas id="heart" width="900" height="700"></canvas>

  <p id="message">
    Semangat terus jalanin hari-harinya yaa. ♡<br>
    Pelan-pelan aja, nggak harus selalu kuat setiap waktu.<br>
    Jangan lupa istirahat, jaga diri, dan tetap jadi
    versi terbaik dari diri kamu. ✨
  </p>

  <button id="replay" hidden onclick="startAnimation()">
    Ulangi Animasi ♡
  </button>

</div>

<div class="footer">
  A LITTLE REMINDER FOR YOU ♡
</div>

<script>

// =============================
// MATRIX PINK RAIN
// =============================

const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

let fontSize = 16;
let drops = [];

function resizeMatrix() {

  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  let columns = Math.ceil(window.innerWidth / fontSize);

  drops = Array.from(
    { length: columns },
    () => Math.random() * -50
  );
}

const letters =
"LOVEYOUアイウエオカキクケコ0123456789♡";

function matrixRain() {

  ctx.fillStyle = "rgba(5, 2, 10, 0.13)";
  ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

  ctx.font = fontSize + "px monospace";

  for (let i = 0; i < drops.length; i++) {

    let char = letters[
      Math.floor(Math.random() * letters.length)
    ];

    ctx.fillStyle =
      Math.random() > 0.5 ? "#ff4acb" : "#a82b91";

    ctx.shadowColor = "#ff00c8";
    ctx.shadowBlur = 10;

    ctx.fillText(
      char,
      i * fontSize,
      drops[i] * fontSize
    );

    if (
      drops[i] * fontSize > window.innerHeight &&
      Math.random() > 0.97
    ) {
      drops[i] = 0;
    }

    drops[i] += 0.5 + Math.random() * 0.7;
  }

  requestAnimationFrame(matrixRain);
}

window.addEventListener("resize", resizeMatrix);

resizeMatrix();
matrixRain();


// =============================
// HEART PARTICLES
// =============================

const heart = document.getElementById("heart");
const hctx = heart.getContext("2d");

let particles = [];
let progress = 0;
let animationFrame;

function createHeart() {

  particles = [];

  for (let i = 0; i < 600; i++) {

    let t = Math.random() * Math.PI * 2;

    let x = 16 * Math.pow(Math.sin(t), 3);

    let y = -(
      13 * Math.cos(t)
      - 5 * Math.cos(2*t)
      - 2 * Math.cos(3*t)
      - Math.cos(4*t)
    );

    let scale = 0.8 + Math.random() * 0.2;

    particles.push({
      x: 450 + x * 21 * scale,
      y: 340 + y * 21 * scale,
      delay: Math.random() * 0.6,
      size: 1 + Math.random() * 3
    });
  }
}

function drawHeart() {

  hctx.clearRect(0, 0, 900, 700);

  progress = Math.min(1, progress + 0.012);

  particles.forEach((p, i) => {

    let alpha = Math.max(
      0,
      Math.min(1, (progress - p.delay * 0.4) * 2)
    );

    if (alpha <= 0) return;

    hctx.globalAlpha = alpha;

    hctx.fillStyle =
      i % 5 === 0 ? "#ffd2f4" : "#ff42c8";

    hctx.shadowColor = "#ff00c8";
    hctx.shadowBlur = 15;

    hctx.beginPath();

    hctx.arc(
      p.x,
      p.y,
      p.size,
      0,
      Math.PI * 2
    );

    hctx.fill();
  });

  hctx.globalAlpha = 1;
  hctx.shadowBlur = 0;

  if (progress < 1) {
    animationFrame = requestAnimationFrame(drawHeart);
  }
}


// =============================
// MAIN ANIMATION
// =============================

const count = document.getElementById("count");
const title = document.getElementById("title");
const message = document.getElementById("message");
const replay = document.getElementById("replay");

let timers = [];

function clearTimers() {

  timers.forEach(clearTimeout);
  timers = [];

  cancelAnimationFrame(animationFrame);
}

function startAnimation() {

  clearTimers();

  count.hidden = false;
  count.textContent = "3";

  count.style.animation = "none";
  void count.offsetWidth;
  count.style.animation = "pop .8s ease";

  title.classList.remove("show");
  message.classList.remove("show");

  replay.hidden = true;

  progress = 0;

  hctx.clearRect(0, 0, 900, 700);

  function later(fn, time) {
    timers.push(setTimeout(fn, time));
  }

  // COUNTDOWN 3

  later(() => {
    count.textContent = "3";
  }, 0);

  // COUNTDOWN 2

  later(() => {
    count.textContent = "2";

    count.style.animation = "none";
    void count.offsetWidth;
    count.style.animation = "pop .8s ease";

  }, 1500);

  // COUNTDOWN 1

  later(() => {
    count.textContent = "1";

    count.style.animation = "none";
    void count.offsetWidth;
    count.style.animation = "pop .8s ease";

  }, 3000);

  // TITLE

  later(() => {

    count.hidden = true;

    title.classList.add("show");

  }, 4500);

  // HEART

  later(() => {

    createHeart();
    drawHeart();

  }, 5500);

  // MESSAGE

  later(() => {

    message.classList.add("show");
    replay.hidden = false;

  }, 7500);
}


// =============================
// OPENING BUTTON
// =============================

let openingStarted = false;

function openMessage() {

  if (openingStarted) return;

  openingStarted = true;

  document
    .getElementById("opening")
    .classList.add("hide");

  setTimeout(() => {

    startAnimation();

  }, 1000);
}

</script>

</body>
</html>
